events {}

http {
  # Docker Compose's embedded DNS resolves "api" to the IP of every
  # currently-running replica of that service; nginx's own DNS resolver
  # (not just a static upstream block) is what lets `--scale api=3`
  # actually spread requests across all three without restarting nginx.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location / {
      set $api_upstream api:4000;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # SSE (GET /api/v1/notifications/stream) needs the connection kept
      # open and unbuffered — otherwise nginx holds the response until it
      # has a full buffer or the upstream closes, which defeats "real-time".
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
